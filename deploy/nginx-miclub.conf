# =============================================================================
# Mi Club — nginx
#   miclub.thedifference.pro    → la app (web + API + uploads + Socket.IO)
#   adminclub.thedifference.pro → redirige a miclub conservando ruta y parámetros, salvo la API y
#                                 Socket.IO (pestañas abiertas con la versión anterior) y /sw.js
#                                 (los navegadores rechazan un service worker redirigido).
# Antes de usarlo, el certificado de miclub tiene que existir (si no, `nginx -t` falla): ver el
# paso 2 de api/CAMBIO_DOMINIO_MI_CLUB.md (certbot --webroot con un sitio temporal).
# Ver api/CAMBIO_DOMINIO_MI_CLUB.md
# =============================================================================

# ----------------------------------------------------------------------------- miclub (HTTPS)
server {
    server_name miclub.thedifference.pro;

    root /var/www/adminclub/app;
    index index.html;

    # Mayor que el archivo más grande que acepta la API: imágenes hasta UPLOAD_MAX_MB (15 MB) y
    # documentos de la ficha / comprobantes hasta 20 MB. Con menos, nginx corta la subida (413)
    # antes de que llegue a Node.
    client_max_body_size 25M;

    access_log /var/log/nginx/miclub.access.log;
    error_log  /var/log/nginx/miclub.error.log;

    # Nunca servir archivos ocultos (.env, .git, etc.) si llegaran a quedar en la carpeta.
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

    # --- API REST ---
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Archivos subidos (logos, banners, avatares) servidos por Express ---
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Socket.IO (WebSocket con fallback a polling) ---
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- Archivos que SIEMPRE se piden de nuevo (sin esto, un celular se queda con una versión
    #     vieja de la app: pantalla en blanco). Coincidencia exacta: ganan a la regla de *.js. ---
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # --- Web (Angular/Ionic, SPA). Las rutas de la app caen a index.html (sin caché). ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- pdf.js (vista previa de recibos): módulo .mjs con su tipo JS (nginx no lo trae). ---
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Archivos con hash en el nombre (cambian de nombre en cada build): caché larga. ---
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/miclub.thedifference.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miclub.thedifference.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ----------------------------------------------------------------------------- miclub (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name miclub.thedifference.pro;

    # Renovación del certificado (certbot --webroot): Let's Encrypt pide este archivo por HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://miclub.thedifference.pro$request_uri;
    }
}

# ----------------------------------------------------------------------------- adminclub (HTTPS)
server {
    server_name adminclub.thedifference.pro;

    root /var/www/adminclub/app;

    client_max_body_size 25M;

    access_log /var/log/nginx/adminclub.access.log;
    error_log  /var/log/nginx/adminclub.error.log;

    # Transición: una pestaña que quedó abierta con la versión anterior sigue usando la API y los
    # avisos en vivo por este dominio. Se atienden igual (mismo backend), no se redirigen.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # El service worker NO se redirige (los navegadores rechazan un SW redirigido): así los
    # celulares que instalaron la app con este dominio reciben el SW corregido y sus
    # notificaciones push siguen llegando.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Todo lo demás (páginas, enlaces de pago e inscripción, imágenes de correos antiguos):
    # redirección permanente a la MISMA ruta y parámetros en el dominio nuevo.
    location / {
        return 301 https://miclub.thedifference.pro$request_uri;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/adminclub.thedifference.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminclub.thedifference.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ----------------------------------------------------------------------------- adminclub (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name adminclub.thedifference.pro;
    return 301 https://miclub.thedifference.pro$request_uri;
}
